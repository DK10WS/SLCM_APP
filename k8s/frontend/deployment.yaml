apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/dk10ws/slcm-frontend:b172843b8bb6be82f8b71290f9aec92a2f7b66da
          ports:
            - containerPort: 8080
