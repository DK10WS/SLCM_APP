apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/dk10ws/slcm-frontend:647aaf52c0bd567ecdb5f293e50af8535fa9f237
          ports:
            - containerPort: 8080
