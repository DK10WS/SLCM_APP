apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/dk10ws/slcm-backend:19d8ad1a88c7d6a53d1696383cd228477eb4a077
          ports:
            - containerPort: 8000
